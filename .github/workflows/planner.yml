name: planner

# The explore planner eval (packages/e2e/evals/planner): what the planner does
# with a pull request's change, judged on fixtures, with a real model. It
# spends model calls, a few cents a run, so it runs on the pull requests that
# can change the planner's input or prompt, and weekly against model drift.
on:
  pull_request:
    paths:
      - 'packages/e2e/src/explore/**'
      - 'packages/e2e/src/agent/prompts.ts'
      - 'packages/e2e/src/agent/protocol.ts'
      - 'packages/e2e/src/agent/index.ts'
      - 'packages/e2e/src/run/changes.ts'
      - 'packages/e2e/evals/planner/**'
      - '.github/workflows/planner.yml'
  schedule:
    # Mondays 05:23 UTC, after the agent suites.
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      models:
        description: 'Gateway model ids, comma separated (default: openai/gpt-6-luna-fast)'
        required: false
        type: string

# The repository's own runs are not usage: the CLI sends no telemetry from CI here.
env:
  E2E_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      # A fork's pull request gets no secrets; say so instead of failing every fixture.
      - name: Require model credential
        id: credential
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "::notice::AI_GATEWAY_API_KEY is not available to this run (a fork's pull request); the planner eval is skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credential.outputs.available == 'true'
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
        if: steps.credential.outputs.available == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.credential.outputs.available == 'true'
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.credential.outputs.available == 'true'
      - name: Install browsers
        if: steps.credential.outputs.available == 'true'
        run: pnpm --filter @e2e-dev/web exec playwright-core install chromium --with-deps
      - name: Build
        if: steps.credential.outputs.available == 'true'
        run: pnpm --filter e2e run build && pnpm --filter @e2e-dev/web run build
      - name: Planner eval
        if: steps.credential.outputs.available == 'true'
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          # Read through a variable, not interpolated into the script.
          MODELS_INPUT: ${{ inputs.models }}
        run: |
          if [ -n "$MODELS_INPUT" ]; then
            pnpm --filter e2e run eval:planner --models "$MODELS_INPUT"
          else
            pnpm --filter e2e run eval:planner
          fi
      # Every run's charters and judgements, for reading a red row without re-running.
      - name: Upload summary
        if: ${{ !cancelled() && steps.credential.outputs.available == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planner-eval
          path: packages/e2e/tests/tmp-projects/planner-eval/summary.*
          if-no-files-found: warn
          retention-days: 14
